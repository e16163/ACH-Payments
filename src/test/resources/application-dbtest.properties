# Profile for tests against real MySQL (README section 7): separate *_test databases, never the real ones.
spring.datasource.url=${TEST_JDBC_URL}
app.db.common=ach_payments_test
app.db.receiving=ach_receiving_test
app.db.origination=ach_origination_test
app.admin-password=x
app.member-password=z
app.orig-password=y
app.recv-password=y
app.log.fallback-file=${java.io.tmpdir}/ach-test-app-error.log
app.fed.outbound-dir=${java.io.tmpdir}/ach-test-fed-outbound
app.fed.retry-backoff-ms=1
app.fed.inbound-dir=${java.io.tmpdir}/ach-test-fed/inbound
app.eod.scheduler-enabled=false
app.receiving.scheduler-enabled=false
