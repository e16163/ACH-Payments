spring.application.name=ach-payments

# Credentials come from environment variables (see README). Never commit real values.
spring.datasource.url=${JDBC_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# UC-SYS-LOG-01 EX-01: how long a log write waits for the database before going to the fallback file
spring.datasource.hikari.connection-timeout=5000

# Demo login passwords (docs/USE-CASES.md P1), also from environment variables.
app.admin-username=${APP_ADMIN_USERNAME:admin}
app.admin-password=${APP_ADMIN_PASSWORD}
app.orig-username=${APP_ORIG_USERNAME:achorig}
app.orig-password=${APP_ORIG_PASSWORD}
app.recv-username=${APP_RECV_USERNAME:achrecv}
app.recv-password=${APP_RECV_PASSWORD}
# Ba's blueprint, ACH Origination step 5: the compliance officer who resolves OFAC hits
app.comp-username=${APP_COMP_USERNAME:achcomp}
app.comp-password=${APP_COMP_PASSWORD}
# Demo member (USE-CASES T7): signs in as "member" and is the sample member M10982347
app.member-username=${APP_MEMBER_USERNAME:member}
app.member-password=${APP_MEMBER_PASSWORD}
app.member-number=${APP_MEMBER_NUMBER:M10982347}

# docs/LDAP-PLAN.md: the LDAP server and base DN that hold users, roles and permissions (ldap/setup.sh starts it).
# The logins above are the fallback.
app.ldap.url=${APP_LDAP_URL:ldap://localhost:1389/dc=achpayments,dc=local}

# UC-SYS-LOG-01 EX-01: where log entries go if AppLog can't be reached
app.log.fallback-file=${APP_LOG_FALLBACK_FILE:${user.home}/dev/logs/app-error.log}

# UC-ACH-EOD-01: the simulated Fed drop folder, the wait after the first failed send, and the origination window scheduler
app.fed.outbound-dir=${APP_FED_OUTBOUND_DIR:${user.home}/dev/fed/outbound}
app.fed.retry-backoff-ms=1000
app.eod.scheduler-enabled=true

# UC-ACH-RCV-01: the simulated Fed's inbound folder (quarantine and archive sit beside it), its made-up signing key,
# and the processing windows (ACHRecvSchedule)
app.fed.inbound-dir=${APP_FED_INBOUND_DIR:${user.home}/dev/fed/inbound}
app.fed.signing-key=${APP_FED_SIGNING_KEY:simulated-fed-signing-key}
# Ba's blueprint, Receiving step 7: where the end-of-day core posting file is written
app.core.posting-dir=${APP_CORE_POSTING_DIR:${user.home}/dev/core/posting}
app.receiving.scheduler-enabled=true

# Separate databases, as in the design diagram (docs/DB-MODEL.md section 0). All on the same MySQL server;
# the datasource's own database (ach_payments) holds shared config and logging.
app.db.common=ach_payments
app.db.receiving=ach_receiving
app.db.origination=ach_origination
spring.flyway.schemas=${app.db.common},${app.db.receiving},${app.db.origination}
spring.flyway.placeholders.recv=${app.db.receiving}
spring.flyway.placeholders.orig=${app.db.origination}
